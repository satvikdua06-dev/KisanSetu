[project]
name = "kisansetu-api"
version = "0.1.0"
description = "KisanSetu backend: multi-agent runtime, deterministic tools, plug-and-play price sources"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
